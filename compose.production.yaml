services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.production
    network_mode: host
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "exec uvicorn app.main:app
      --host 127.0.0.1
      --port 8000
      --workers 2"
    env_file:
      - .env.production
    network_mode: host
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully