name: Deploy ResearchHUB

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/researchhub
          git fetch origin
          git reset --hard origin/main

      - name: Desplegar aplicacion
        run: |
          cd /opt/researchhub
          docker compose -f compose.production.yaml up -d --build

      - name: Mostrar logs de migracion si fallo el despliegue
        if: failure()
        run: |
          cd /opt/researchhub
          docker compose -f compose.production.yaml ps -a
          docker compose -f compose.production.yaml logs --no-color --tail=200 migrate

      - name: Verificar contenedores
        run: |
          cd /opt/researchhub
          docker compose -f compose.production.yaml ps

      - name: Verificar salud
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8000/health/ready; then
              echo "ResearchHUB esta saludable"
              exit 0
            fi

            echo "Esperando a ResearchHUB... intento $i/30"
            sleep 2
          done

          echo "ResearchHUB no respondio a tiempo"
          docker compose -f /opt/researchhub/compose.production.yaml logs --tail=100 api
          exit 1